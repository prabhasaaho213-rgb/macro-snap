org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
#
# AGP 9 deprecates the `org.jetbrains.kotlin.android` plugin that every Flutter
# plugin still applies, so each module prints "w: Deprecated
# 'org.jetbrains.kotlin.android' plugin usage" during the build. It is a
# deprecation notice, not an error, and there is no version to bump: the
# warning is emitted for :app and for every plugin module alike (pub-cache
# packages cannot be changed from here). It goes away only when the app and all
# plugins migrate to AGP's built-in Kotlin
# (https://kotl.in/gradle/agp-built-in-kotlin), which is a wider migration than
# this release. Leave the flags as the template set them.
android.builtInKotlin=false
# Fix "failed to strip debug symbols from native libraries" with NDK 28
android.enableSeparateNativeLibStrip=false
# Play Console: "Optimized resource shrinking isn't enabled" — AGP 9 enables
# the optimized R8 resource-shrinking pipeline by default; declared explicitly
# so the resolved config never depends on a version default.
android.r8.optimizedResourceShrinking=true
