name: macro_snap
description: "Snap a photo, get your macros instantly."
publish_to: 'none'
version: 1.5.9+110

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  image_picker: ^1.1.2
  fl_chart: ^0.70.2
  path_provider: ^2.1.2
  uuid: ^4.5.1
  razorpay_flutter: ^1.4.5
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  share_plus: ^10.1.4
  # Renders the Play Store link as a scannable QR on the weekly share card.
  # Every shared image therefore carries a working install path — a text URL
  # under a screenshot is decoration, a QR is a tap-and-go.
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.7
  camera: ^0.11.1
  permission_handler: ^11.3.1

  # These four move together: firebase_auth 6.5.x still calls the
  # `customAuthDomain` field that firebase_core removed in 4.14, so a lock-free
  # resolve can pick a pair that fails `compileReleaseJavaWithJavac`. The floors
  # below are the lowest versions this app is actually built against.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_crashlytics: ^5.4.0
  google_sign_in: ^6.3.0
  cloud_firestore: ^6.8.0
  flutter_timezone: ^5.1.0
  package_info_plus: ^9.0.1
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ic_notification_large.png
    - assets/animations/logo_intro.json
  # Inter is bundled so text renders with the real font from the very first
  # frame. Without it, google_fonts fetches Inter over the network at runtime
  # and every text on screen visibly swaps from the fallback font (flicker),
  # most noticeable on the first screen shown — the onboarding tabs.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
