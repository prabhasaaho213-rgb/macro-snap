name: Build and Release AAB

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not mutable tags. A tag like @v4 can
      # be moved to new code at any time, and this workflow holds the signing
      # keystore — a compromised upstream tag would get the key.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Android SDK and NDK
        run: |
          flutter doctor -v
          yes | sdkmanager --licenses 2>/dev/null || true
          yes | sdkmanager --install "ndk;27.0.12077973" 2>/dev/null || true

      # The tag must match what the archive says it is. A v1.5.30 tag built from
      # a pubspec still at 1.5.29 used to publish an artifact that could never
      # install over (or update) the previous release.
      - name: Verify tag matches pubspec version
        run: |
          APP_VERSION="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml | head -n1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pubspec: $APP_VERSION / tag: $TAG_VERSION"
          if [ -z "$APP_VERSION" ]; then
            echo "ERROR: could not read version from pubspec.yaml"
            exit 1
          fi
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: tag v$TAG_VERSION does not match pubspec version $APP_VERSION"
            exit 1
          fi

      # Secrets reach the shell as environment variables, never as inline
      # `${{ secrets.* }}` interpolations: an interpolated value is substituted
      # into the script text before bash parses it, so a value containing a
      # quote, `$(...)` or a newline becomes shell code with the runner's
      # privileges.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=app/upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          chmod 600 android/key.properties
          echo "Signing configured"

      - name: Get dependencies
        run: flutter pub get

      # Gates run BEFORE the signed artifacts, so a tag can never publish a
      # build that fails static analysis or the test suite. Codemagic already
      # runs both; this workflow used to publish whatever compiled.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Verify AAB
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            echo "AAB built: $(ls -lh "$AAB_PATH" | awk '{print $5}')"
          else
            echo "ERROR: AAB not found"
            exit 1
          fi

      - name: Rename artifacts
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cp build/app/outputs/bundle/release/app-release.aab "macro-snap-$TAG_NAME.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "macro-snap-$TAG_NAME.apk"

      # The keystore and signing config are build-only inputs: they must not be
      # left where a later step (or an uploaded artifact) could pick them up.
      - name: Remove signing material
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        with:
          files: |
            macro-snap-${{ github.ref_name }}.aab
            macro-snap-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
